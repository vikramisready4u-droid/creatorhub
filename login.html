<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Creator Hub</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
font-family:'Poppins',sans-serif;
background:#020617;
}

.glow{
box-shadow:0 0 25px rgba(168,85,247,.4);
}
</style>

</head>

<body class="text-white min-h-screen flex items-center justify-center p-6">

<!-- Loader -->

<div id="loader"
class="hidden fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center">

<h1 class="text-4xl font-bold text-violet-400">
Creator Hub
</h1>

<p class="mt-4 text-gray-400 animate-pulse">
Logging In...
</p>

</div>

<!-- Back Button -->

<a href="index.html"
class="fixed top-5 left-5 bg-slate-800 px-4 py-2 rounded-xl">
← Home
</a>

<!-- Login Card -->

<div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 w-full max-w-md shadow-2xl">

<h1 class="text-center text-5xl font-extrabold bg-gradient-to-r from-violet-400 to-fuchsia-500 bg-clip-text text-transparent">
Creator Hub
</h1>

<p class="text-center text-gray-400 mt-2">
Welcome Back
</p>

<input
id="email"
type="email"
placeholder="Enter Email"
class="w-full mt-8 p-4 rounded-xl text-black">

<input
id="password"
type="password"
placeholder="Enter Password"
class="w-full mt-4 p-4 rounded-xl text-black">

<button
id="googleBtn"
class="w-full mt-5 bg-white text-black p-4 rounded-xl font-bold">
🔵 Continue with Google
</button>

<button
id="loginBtn"
onclick="showLoader()"
class="w-full mt-5 bg-gradient-to-r from-violet-600 to-fuchsia-600 p-4 rounded-xl font-bold glow">
Login
</button>

<p class="text-center mt-6 text-gray-400">
Don't have an account?
<a href="signup.html" class="text-cyan-400">
Sign Up
</a>
</p>

<p class="text-center text-xs text-gray-500 mt-8">
Built by Vikram Suthar
</p>

</div>

<script>
function showLoader(){
document.getElementById("loader")
.classList.remove("hidden");
}
</script>

<script type="module" src="app.js"></script>

</body>
</html>

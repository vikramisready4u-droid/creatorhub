class="text-3xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">

<div class="space-y-6">

    class="bg-slate-800 p-6 rounded-3xl">
      <h3 class="text-xl font-bold text-violet-400">

      </h3>

      <p class="text-gray-400 mt-2">

</div>
</div>

      </div>

    </div>

  </div>

<script>
const hour = new Date().getHours();

let greeting = "";

if(hour < 12){
  greeting = "Good Morning ☀️";
}
else if(hour < 17){
  greeting = "Good Afternoon 🌤️";
}
else if(hour < 21){
  greeting = "Good Evening 🌆";
}
else{
  greeting = "Good Night 🌙";
}

document.addEventListener("DOMContentLoaded", () => {
  const el = document.getElementById("greeting");
  if(el){
    el.textContent = greeting + ", Creator 👋";
  }
});
</script>
<script type="module" src="app.js"></script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Dashboard - Creator Hub</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white">

  <div class="flex">

    <!-- Sidebar -->

    <div class="w-64 h-screen bg-gray-900 p-6">

      <h1 class="text-3xl font-bold text-cyan-400">
        Creator Hub
      </h1>

      <div class="mt-10 flex flex-col gap-4">

        <a href="#" class="bg-cyan-500 p-3 rounded-xl">
          Dashboard
        </a>

        <a href="#" class="bg-gray-800 p-3 rounded-xl">
          AI Scripts
        </a>

        <a href="#" class="bg-gray-800 p-3 rounded-xl">
          Captions
        </a>

        <a href="#" class="bg-gray-800 p-3 rounded-xl">
          Trends
        </a>

      </div>

      <button
        id="logoutBtn"
        class="bg-red-500 px-4 py-3 rounded-xl mt-10 w-full">
        Logout
      </button>

    </div>

    <!-- Main Content -->

    <div class="flex-1 p-10">

      <h2 class="text-5xl font-bold">
        Welcome Creator 🚀
      </h2>

      <p
        id="userEmail"
        class="text-gray-400 mt-4 text-xl">
      </p>

      <div class="mt-10 bg-gray-900 p-8 rounded-2xl">

        <h3 class="text-3xl font-bold text-cyan-400">
          AI Script Generator
        </h3>

        <input
          id="topicInput"
          type="text"
          placeholder="Enter video topic..."
          class="w-full p-4 rounded-xl text-black mt-6"
        >

        <button
          id="generateBtn"
          class="bg-cyan-500 px-6 py-3 rounded-xl mt-6">
          Generate Script
        </button>

        <div
          id="scriptOutput"
          class="mt-6 text-gray-300 whitespace-pre-line">
        </div>

      </div>

    </div>

  </div>

<script type="module" src="app.js"></script>
</body>
</html>

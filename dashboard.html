<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Dashboard - Creator Hub</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white">

  <div class="flex">

    <!-- Sidebar -->

    <div class="w-72 h-screen bg-slate-900 border-r border-slate-800 p-6">

      <h1 class="text-3xl font-bold bg-gradient-to-r from-violet-500 to-fuchsia-500 bg-clip-text text-transparent">
        Creator Hub
      </h1>

      <div class="mt-10 flex flex-col gap-4">

        <a href="#" class="bg-gradient-to-r from-violet-600 to-fuchsia-600 p-3 rounded-xl">
          Dashboard
        </a>

        <a href="ai.html" class="bg-gray-800 p-3 rounded-xl">
  AI Tools
</a>

        <a href="#" class="bg-gray-800 p-3 rounded-xl">
          Captions
        </a>

        <a href="#" class="bg-gray-800 p-3 rounded-xl">
          Trends
        </a>

      </div>

      <button
        id="logoutBtn"
        class="bg-red-500 px-4 py-3 rounded-xl mt-10 w-full">
        Logout
      </button>

    </div>

    <!-- Main Content -->

    <div class="flex-1 p-10">

      <h2 class="text-5xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
        Welcome Creator 🚀
      </h2>

      <p
        id="userEmail"
        class="text-gray-400 mt-4 text-xl">
      </p>

      <div class="mt-10 bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl">

        <div class="mt-10 grid grid-cols-2 gap-6">

<div class="bg-slate-900 p-6 rounded-3xl">
<h3 class="text-violet-400 text-xl">Scripts Generated</h3>
<p class="text-4xl font-bold mt-2">25</p>
</div>

<div class="bg-slate-900 p-6 rounded-3xl">
<h3 class="text-violet-400 text-xl">Creator Score</h3>
<p class="text-4xl font-bold mt-2">92</p>
</div>

<div class="bg-slate-900 p-6 rounded-3xl">
<h3 class="text-violet-400 text-xl">Captions Created</h3>
<p class="text-4xl font-bold mt-2">18</p>
</div>

<div class="bg-slate-900 p-6 rounded-3xl">
<h3 class="text-violet-400 text-xl">Trending Topics</h3>
<p class="text-4xl font-bold mt-2">42</p>
</div>

</div>

      </div>

    </div>

  </div>

<script type="module" src="app.js"></script>
</body>
</html>

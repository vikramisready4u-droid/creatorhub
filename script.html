<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white p-6">

<a href="youtube.html"
class="bg-slate-800 px-4 py-2 rounded-xl">
← Back
</a>

<h1 class="text-4xl font-bold mt-8">
🎬 Script Generator
</h1>

<input id="topicInput"
type="text"
placeholder="Enter video topic..."
class="w-full mt-8 p-4 rounded-2xl bg-slate-800">

<button id="generateBtn"
class="mt-6 bg-gradient-to-r from-violet-600 to-fuchsia-600 px-6 py-3 rounded-2xl">
Generate Script
</button>

<div id="scriptOutput"
class="mt-8 bg-slate-900 p-6 rounded-3xl min-h-[200px]">
Output will appear here...
</div>

<script>
const topicInput =
  document.getElementById("topicInput");

const generateBtn =
  document.getElementById("generateBtn");

const scriptOutput =
  document.getElementById("scriptOutput");

generateBtn.addEventListener("click", async () => {

  const topic = topicInput.value.trim();

  if (!topic) {
    scriptOutput.innerText =
      "Please enter a topic.";
    return;
  }

  scriptOutput.innerText =
    "🤖 AI is thinking...";

  try {

    const response = await fetch(
      "/api/gemini",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          prompt:
            `Write a YouTube Shorts script about ${topic}`
        })
      }
    );

    const data =
      await response.json();
console.log(data);

if (!response.ok) {
  throw new Error(
    data.error || "Server Error"
  );
}
    scriptOutput.innerText =
      data.result;

  } catch (error) {

console.log(error);
    scriptOutput.innerText =
  "Error: " + error.message;

  }

});
</script>
</body>
</html>
